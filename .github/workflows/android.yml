name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Checkout upstream PuzzleKit dataset
        uses: actions/checkout@v4
        with:
          repository: SmilingWayne/puzzlekit-dataset
          path: dataset-upstream
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle offline PuzzleKit corpus
        run: python3 scripts/import_dataset.py --source dataset-upstream/assets/data --all
      - name: Generate app icons
        run: npx tauri icon public/icon.svg
      - name: Initialize Android project
        run: npx tauri android init --ci
      - name: Build installable arm64 APK
        run: npx tauri android build --apk --target aarch64
      - name: Sign APK for sideload or release distribution
        env:
          SIGNING_STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/puzzlesSet.jks"
          if [[ -n "$SIGNING_STORE_B64" ]]; then
            printf '%s' "$SIGNING_STORE_B64" | base64 --decode > "$KEYSTORE"
            PASS="$SIGNING_STORE_PASS"
            KEY_PASS="${SIGNING_KEY_PASS:-$PASS}"
            ALIAS="${SIGNING_ALIAS:-puzzlesset}"
            echo "Using configured release signing key"
          else
            PASS="temporary-testing-key"
            KEY_PASS="$PASS"
            ALIAS="puzzlesset"
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$KEY_PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=puzzlesSet Testing, O=puzzlesSet"
            echo "::warning::No release signing key configured. Installable test APK only; signatures change on each CI run."
          fi
          ROOT="src-tauri/gen/android/app/build/outputs/apk"
          APK="$(find "$ROOT" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass "pass:$PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$ALIAS" --out "$ROOT/puzzlesSet-arm64-signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose "$ROOT/puzzlesSet-arm64-signed.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzlesSet-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/puzzlesSet-arm64-signed.apk
          if-no-files-found: error

name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Checkout upstream PuzzleKit dataset
        uses: actions/checkout@v4
        with:
          repository: SmilingWayne/puzzlekit-dataset
          path: dataset-upstream
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle offline PuzzleKit corpus
        run: python3 scripts/import_dataset.py --source dataset-upstream/assets/data --all
      - name: Generate app icons
        run: npx tauri icon public/icon.svg
      - name: Initialize Android project
        run: npx tauri android init --ci
      - name: Build installable arm64 APK
        run: npx tauri android build --apk --target aarch64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzlesSet-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

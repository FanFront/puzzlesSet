[package]
name = "puzzlesset"
version = "0.1.0"
description = "Offline puzzle game and answer checker"
authors = ["puzzlesSet contributors"]
edition = "2021"

[lib]
name = "puzzlesset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
